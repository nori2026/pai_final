# ROS 2 <-> Gazebo のトピック変換(ブリッジ)設定
# 記事の nav_teleop.yaml を拡張し、カメラ画像とオドメトリも変換する
---
# ROS 2 の /cmd_vel(速度指令) を Gazebo に送る
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ

# Gazebo のカメラ画像を ROS 2 に送る（AIの入力）
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

# ロボットの位置(オドメトリ)を ROS 2 に送る（確認・レポート用）
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS
